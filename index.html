<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mediadate</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --card2:#fafafa; --text:#1d1d1f; --muted:#6e6e73; --faint:#a1a1a6;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.14);
  --accent:#0071e3; --accent-soft:rgba(0,113,227,.10); --accent-text:#0066cc;
  --green:#1f9d55; --green-soft:rgba(31,157,85,.12);
  --orange:#c66a00; --orange-soft:rgba(255,159,10,.14);
  --red:#d70015; --red-soft:rgba(215,0,21,.10);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --card2:#232325; --text:#f5f5f7; --muted:#98989d; --faint:#636366;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --accent:#0a84ff; --accent-soft:rgba(10,132,255,.16); --accent-text:#4da3ff;
    --green:#30d158; --green-soft:rgba(48,209,88,.14);
    --orange:#ff9f0a; --orange-soft:rgba(255,159,10,.16);
    --red:#ff453a; --red-soft:rgba(255,69,58,.14);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#ff6b6b,#ff9f0a 45%,#0a84ff);display:grid;place-items:center;color:#fff}
.brand{font-weight:650;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.primary:disabled{opacity:.4;cursor:default;filter:none}
.btn.lg{padding:12px 22px;font-size:16px}

main{max-width:1240px;margin:0 auto;padding:28px 24px 140px}

/* empty */
.empty{min-height:calc(100vh - 220px);display:grid;place-items:center}
.drop{width:min(720px,100%);text-align:center;padding:64px 32px;border-radius:28px;border:2px dashed var(--line2);background:var(--card);box-shadow:var(--shadow);transition:.2s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .bigic{width:84px;height:84px;margin:0 auto 22px;border-radius:24px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.drop h1{font-size:32px;letter-spacing:-.025em;margin:0 0 10px;font-weight:700}
.drop p{color:var(--muted);margin:0 auto 26px;max-width:480px;font-size:16px}
.formats{margin-top:22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.privacy{margin-top:18px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}

/* workspace */
.ws{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:920px){.ws{grid-template-columns:1fr}}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
@media (max-width:920px){.side{position:static}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.pad{padding:22px}
.preview{aspect-ratio:1/1;background:#000;display:grid;place-items:center;position:relative}
.preview video,.preview img{width:100%;height:100%;object-fit:contain;display:block}
.preview .ph{color:#8e8e93;text-align:center;font-size:13px;padding:20px}
.fname{font-weight:650;font-size:17px;word-break:break-all;letter-spacing:-.01em}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:12px;font-weight:550;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text)}
.badge.gray{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.facts{margin:0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.facts li:first-child{border-top:0}
.facts span:first-child{color:var(--muted);flex-shrink:0}
.facts span:last-child{text-align:right;word-break:break-word}

.mainc{display:flex;flex-direction:column;gap:24px;min-width:0}
.ch{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.ch .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.ic.blue{background:var(--accent-soft);color:var(--accent)}
.ic.green{background:var(--green-soft);color:var(--green)}
.ic.orange{background:var(--orange-soft);color:var(--orange)}
.ch h2{margin:0;font-size:19px;letter-spacing:-.015em}
.ch p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ch .sp{flex:1}

/* date compare */
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch;margin-bottom:22px}
@media (max-width:640px){.cmp{grid-template-columns:1fr}.cmp .arr{transform:rotate(90deg);justify-self:center}}
.when{border-radius:14px;padding:16px 18px;background:var(--card2);border:1px solid var(--line)}
.when.new{background:var(--accent-soft);border-color:transparent}
.when.same{opacity:.55}
.when .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650;margin-bottom:6px}
.when .d{font-size:22px;font-weight:650;letter-spacing:-.02em}
.when .t{font-size:30px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.when .t b{font-weight:600}
.when .tz{font-size:14px;font-weight:550;color:var(--muted);margin-left:6px}
.when .sub{font-size:13px;color:var(--muted);margin-top:4px}
.arr{display:grid;place-items:center;color:var(--faint)}

.fields{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:12px}
@media (max-width:640px){.fields{grid-template-columns:1fr}}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:550;margin:0 0 6px 2px}
.inp{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--card);font-variant-numeric:tabular-nums;outline:none;transition:.15s;min-height:44px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.inp:disabled{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line2);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;transition:.12s}
.chip:hover{border-color:var(--accent);color:var(--accent-text)}
.chip.reset{margin-left:auto;color:var(--muted)}
.delta{margin-top:16px;font-size:14px;padding:10px 14px;border-radius:11px;background:var(--card2);color:var(--muted)}
.delta.on{background:var(--orange-soft);color:var(--orange);font-weight:550}
.note{margin-top:12px;font-size:13px;padding:10px 14px;border-radius:11px;background:var(--orange-soft);color:var(--orange)}

/* location */
.loc{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.loc .coords{font-size:22px;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.loc .sub{font-size:13px;color:var(--muted);margin-top:2px}
.loc a{color:var(--accent-text);text-decoration:none;font-weight:500;font-size:14px}
.loc a:hover{text-decoration:underline}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;user-select:none}
.switch input{appearance:none;width:42px;height:26px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:.2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:19px}
.locf{display:grid;grid-template-columns:1fr 1fr .7fr;gap:12px;margin-top:16px}
@media (max-width:640px){.locf{grid-template-columns:1fr}}

/* changes */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .where{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tbl .from{color:var(--red);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--red) 50%,transparent);font-family:var(--mono);font-size:12.5px;word-break:break-all}
.tbl .to{color:var(--green);font-family:var(--mono);font-size:12.5px;font-weight:600;word-break:break-all}
.tbl .val{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.tbl .k{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.tblwrap{overflow-x:auto}
.emptych{padding:26px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line2);border-radius:14px}
.grp td{background:var(--card2);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:650;color:var(--muted);padding:7px 10px}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:550;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{margin-bottom:14px}

/* tracks */
.tracks{display:grid;gap:14px}
.trk{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card2)}
.trk-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.trk-h .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.trk-h b{font-size:15px}
.trk-h .muted{font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:14px;font-weight:550;font-variant-numeric:tabular-nums;word-break:break-word}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.key{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:7px;background:var(--card);border:1px solid var(--line)}

/* tree */
.tree{font-family:var(--mono);font-size:12.5px}
.tree details{margin-left:16px;border-left:1px solid var(--line);padding-left:10px}
.tree > details{margin-left:0;border-left:0;padding-left:0}
.tree summary{cursor:pointer;padding:3px 0;list-style:none;display:flex;gap:10px;align-items:baseline}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:var(--faint);width:10px;display:inline-block;transition:.15s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree .leaf{margin-left:16px;border-left:1px solid var(--line);padding:3px 0 3px 20px;display:flex;gap:10px;align-items:baseline}
.tree .ty{color:var(--accent-text);font-weight:600}
.tree .sz{color:var(--faint)}
.tree .info{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
pre.xmp{font-family:var(--mono);font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;max-height:520px;margin:0;white-space:pre-wrap;word-break:break-all}

/* savebar */
.savebar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:18px;padding:10px 10px 10px 22px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.18);max-width:calc(100% - 32px)}
.savebar .txt{font-size:14px}
.savebar .txt b{font-variant-numeric:tabular-nums}
.savebar .txt .muted{font-size:12.5px;display:block}

#dropOverlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--accent) 18%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;pointer-events:none;opacity:0;transition:.15s}
#dropOverlay.on{opacity:1}
#dropOverlay div{background:var(--card);padding:22px 30px;border-radius:20px;font-size:18px;font-weight:600;box-shadow:var(--shadow)}

dialog{border:0;border-radius:22px;padding:0;background:var(--card);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35);width:min(520px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
.dlg{padding:28px}
.dlg h3{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.dlg ol{padding-left:20px;margin:16px 0 22px;display:grid;gap:10px}
.okic{width:52px;height:52px;border-radius:16px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin-bottom:16px}
.err{background:var(--red-soft);color:var(--red);padding:14px 18px;border-radius:14px;margin-bottom:20px}

/* language switcher */
.lang{display:flex;gap:2px;padding:3px;background:var(--card2);border:1px solid var(--line);border-radius:999px;flex-shrink:0}
.lang button{border:0;background:transparent;padding:5px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:650;letter-spacing:.04em;color:var(--muted);transition:.15s}
.lang button:hover{color:var(--text)}
.lang button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:640px){.top{padding:10px 16px}.brand small{display:none}}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/></svg></div>
  <div class="brand">Mediadate<small data-i18n="brandSub">Date, location &amp; metadata of iPhone photos and videos</small></div>
  <div class="sp"></div>
  <button class="btn" id="openBtn2" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="otherFile">Open another</span></button>
  <div class="lang" id="lang" role="group" aria-label="Language"><button data-lang="en" class="on" aria-pressed="true">EN</button><button data-lang="ru" aria-pressed="false">RU</button></div>
</header>

<main>
  <div id="err" class="err" hidden></div>

  <section class="empty" id="empty">
    <div class="drop" id="drop">
      <div class="bigic"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4M9 15l2 2 4-4"/></svg></div>
      <h1 data-i18n="dropTitle">Fix the capture date</h1>
      <p data-i18n="dropText"></p>
      <button class="btn primary lg" id="openBtn" data-i18n="chooseFile">Choose file</button>
      <div class="formats"><span class="pill">MOV</span><span class="pill">MP4</span><span class="pill">HEIC</span><span class="pill">JPEG</span></div>
      <div class="privacy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-i18n="privacy"></span></div>
    </div>
  </section>

  <section class="ws" id="ws" hidden>
    <aside class="side">
      <div class="card">
        <div class="preview" id="preview"></div>
        <div class="pad">
          <div class="fname" id="fname"></div>
          <div class="badges" id="badges"></div>
        </div>
      </div>
      <div class="card pad"><ul class="facts" id="facts"></ul></div>
    </aside>

    <div class="mainc">
      <!-- DATE -->
      <div class="card pad" id="dateCard">
        <div class="ch">
          <div class="ic blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
          <div><h2 data-i18n="dateTitle"></h2><p id="dateSrc"></p></div>
        </div>
        <div class="cmp">
          <div class="when" id="whenOld"></div>
          <div class="arr"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
          <div class="when new" id="whenNew"></div>
        </div>
        <div class="fields">
          <div class="fld"><label for="inDate" data-i18n="lblDate"></label><input class="inp" type="date" id="inDate"></div>
          <div class="fld"><label for="inTime" data-i18n="lblTime"></label><input class="inp" type="time" step="1" id="inTime"></div>
          <div class="fld"><label for="inTz" data-i18n="lblTz"></label><select class="inp" id="inTz"></select></div>
        </div>
        <div class="chips" id="chips">
          <button class="chip" data-s="-86400" data-i18n="chipDm"></button>
          <button class="chip" data-s="-3600" data-i18n="chipHm"></button>
          <button class="chip" data-s="-60" data-i18n="chipMm"></button>
          <button class="chip" data-s="60" data-i18n="chipMp"></button>
          <button class="chip" data-s="3600" data-i18n="chipHp"></button>
          <button class="chip" data-s="86400" data-i18n="chipDp"></button>
          <button class="chip reset" id="resetDate" data-i18n="reset"></button>
        </div>
        <div class="delta" id="delta"></div>
        <div class="note" id="dateNote" hidden></div>
      </div>

      <!-- LOCATION -->
      <div class="card pad" id="locCard">
        <div class="ch">
          <div class="ic green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
          <div><h2 data-i18n="locTitle"></h2><p id="locSrc"></p></div>
          <div class="sp"></div>
          <label class="switch" id="locSwitchWrap"><input type="checkbox" id="locSwitch"> <span data-i18n="locEdit"></span></label>
        </div>
        <div class="loc" id="locView"></div>
        <div class="locf" id="locFields" hidden>
          <div class="fld"><label for="inLat" data-i18n="lblLat"></label><input class="inp" id="inLat" inputmode="decimal" placeholder="48.8584"></div>
          <div class="fld"><label for="inLon" data-i18n="lblLon"></label><input class="inp" id="inLon" inputmode="decimal" placeholder="2.2945"></div>
          <div class="fld"><label for="inAlt" data-i18n="lblAlt"></label><input class="inp" id="inAlt" inputmode="decimal" placeholder="—"></div>
        </div>
        <div class="note" id="locNote" hidden></div>
      </div>

      <!-- CHANGES -->
      <div class="card pad">
        <div class="ch">
          <div class="ic orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></div>
          <div><h2 data-i18n="chTitle"></h2><p data-i18n="chSub"></p></div>
        </div>
        <div id="changes"></div>
      </div>

      <!-- DETAILS -->
      <div class="card pad">

<script id="core">
const Core = (() => {
'use strict';
const td = new TextDecoder('utf-8');
const te = new TextEncoder();
const EPOCH1904 = Date.UTC(1904, 0, 1);

/* ---------- bytes ---------- */
const dv = b => new DataView(b.buffer, b.byteOffset, b.byteLength);
const u16 = (b, o) => dv(b).getUint16(o);
const u32 = (b, o) => dv(b).getUint32(o);
const u64 = (b, o) => { const d = dv(b); return d.getUint32(o) * 4294967296 + d.getUint32(o + 4); };
const str4 = (b, o) => String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);
const ascii = s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; };
const be32 = n => { const a = new Uint8Array(4); dv(a).setUint32(0, n); return a; };
function concat(parts) { let n = 0; for (const p of parts) n += p.length; const o = new Uint8Array(n); let i = 0; for (const p of parts) { o.set(p, i); i += p.length; } return o; }
async function readSlice(file, a, b) { return new Uint8Array(await file.slice(a, b).arrayBuffer()); }
const cstr = (b, o) => { let e = o; while (e < b.length && b[e]) e++; return [td.decode(b.subarray(o, e)), e + 1]; };
const hex = (b, max = 24) => Array.from(b.subarray(0, max), x => x.toString(16).padStart(2, '0')).join(' ') + (b.length > max ? ' …' : '');

/* ---------- time ---------- */
const pad = (n, w = 2) => String(n).padStart(w, '0');
const parts = ms => { const d = new Date(ms); return { Y: d.getUTCFullYear(), M: d.getUTCMonth() + 1, D: d.getUTCDate(), h: d.getUTCHours(), m: d.getUTCMinutes(), s: d.getUTCSeconds() }; };
const offStr = (min, colon = true) => { const s = min < 0 ? '-' : '+'; const a = Math.abs(min); return s + pad(Math.floor(a / 60)) + (colon ? ':' : '') + pad(a % 60); };
function parseOff(s) { if (s == null) return null; s = s.trim(); if (s === 'Z') return 0; const m = /^([+-])(\d\d):?(\d\d)$/.exec(s); return m ? (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]) : null; }

    for (const r of rows) if (r.hdr && r.n > 1) { r.label = tr('hdrStamps', r.n); r.where = tr('hdrWhere', [...r.parts].join(', ')); }
    for (const c of rows) {
      if (c.group !== g) { g = c.group; html += `<tr class="grp"><td colspan="3">${esc(g)}</td></tr>`; }
      html += `<tr><td><div>${esc(c.label)}</div><div class="where">${esc(c.where)}</div></td><td class="from">${esc(c.from)}</td><td class="to">${esc(c.to)}</td></tr>`;
    }
    box.innerHTML = html + '</tbody></table></div>';
  }
  const n = C.length;
  $('saveBtn').disabled = !n;
  $('saveTxt').innerHTML = n ? `${tr('saveCount', n)}<span class="muted">${esc(tr(S.M.kind === 'video' ? 'noReencodeV' : 'noReencodeP'))}</span>` : `${esc(tr('noChanges'))}<span class="muted">${esc(tr('pickNew'))}</span>`;
}

/* ---------- tabs ---------- */
function tabList() {
  const M = S.M;
  if (M.kind === 'video') return [['tracks', tr('tabTracks', M.tracks.length)], ['meta', tr('tabMeta')], ['tree', tr('tabTree')]];
  const t = [['exif', 'EXIF'], ['gps', 'GPS']];
  if (M.makerNote.length) t.push(['apple', 'Apple MakerNote']);
  if (M.xmps.length) t.push(['xmp', 'XMP']);
  t.push(['tree', tr('tabTree')]);
  return t;
}
function renderTabs() {
  const tl = tabList(); if (!S.tab || !tl.find(t => t[0] === S.tab)) S.tab = tl[0][0];
  $('tabs').innerHTML = tl.map(([k, l]) => `<button class="tab${k === S.tab ? ' on' : ''}" data-tab="${k}">${esc(l)}</button>`).join('');
  const M = S.M, b = $('tabBody');
  const search = (ph) => `<input class="inp search" id="q" placeholder="${esc(ph)}" value="${esc(S.q)}">`;
  if (S.tab === 'tracks') b.innerHTML = renderTracks(M);
  else if (S.tab === 'meta') { b.innerHTML = search(tr('searchKeys')) + '<div id="tblBody"></div>'; renderMetaTable(); }
  else if (S.tab === 'exif') { b.innerHTML = search(tr('searchTags')) + '<div id="tblBody"></div>'; renderExifTable(['IFD0', 'Exif', 'Interop', 'IFD1']); }
  else if (S.tab === 'gps') { b.innerHTML = '<div id="tblBody"></div>'; renderExifTable(['GPS']); }
  else if (S.tab === 'apple') b.innerHTML = `<div class="tblwrap"><table class="tbl"><thead><tr><th>${tr('thTag')}</th><th>${tr('thValue')}</th></tr></thead><tbody>` + M.makerNote.map(m => `<tr><td class="k">${esc(m.name)}</td><td class="val">${esc(m.value)}</td></tr>`).join('') + '</tbody></table></div>';
  else if (S.tab === 'xmp') b.innerHTML = M.xmps.map(x => `<pre class="xmp">${esc(x.text.replace(/\s+$/, ''))}</pre>`).join('<div style="height:12px"></div>');
  else if (S.tab === 'tree') b.innerHTML = renderTree(M);
  const q = $('q'); if (q) q.oninput = () => { S.q = q.value; S.tab === 'meta' ? renderMetaTable() : renderExifTable(['IFD0', 'Exif', 'Interop', 'IFD1']); };
}
function renderTracks(M) {
  const icon = h => h === 'vide' ? ['blue', '<path d="M4 6h11a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM17 10l5-3v10l-5-3"/>'] : h === 'soun' ? ['green', '<path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4"/>'] : ['orange', '<path d="M4 7h16M4 12h16M4 17h10"/>'];
  return '<div class="tracks">' + M.tracks.map(T => {
    const [c, p] = icon(T.handler);
    const title = T.handler === 'meta' && T.keys?.length ? (Core.KEY_LABEL[T.keys.find(k => Core.KEY_LABEL[k])] || T.keys[0]) : (Core.HANDLER[T.handler] || T.handler);
    const st = [];
    const s = (l, v) => { if (v != null && v !== '' && v !== 'NaN') st.push(`<div class="stat"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div></div>`); };
    s(tr('sCodec'), `${Core.CODEC[T.format] || ''} ${T.format ? '(' + T.format + ')' : ''}`.trim());
    if (T.handler === 'vide') { s(tr('sRes'), `${T.cw}×${T.ch}`); s(tr('fFps'), T.fps && (+T.fps.toFixed(3)) + ' ' + tr('uFps')); if (T.rotation) s(tr('fRot'), T.rotation + '°'); }
    if (T.handler === 'soun') { s(tr('sRate'), T.timescale + ' ' + tr('uHz')); s(tr('sChannels'), T.channels); }
    s(tr('fDuration'), dur(T.duration)); s(tr('sSamples'), T.samples?.toLocaleString(loc()));
    if (T.bitrate) s(tr('sBitrate'), mbit(T.bitrate)); if (T.bytes != null) s(tr('sSize'), bytes(T.bytes));
    s(tr('sLang'), T.lang); s(tr('sCreated'), T.created != null ? Core.fmtUtc(Core.qtToMs(T.created)) : null); s(tr('sModified'), T.modified != null ? Core.fmtUtc(Core.qtToMs(T.modified)) : null);
    let extra = '';
    if (T.keys?.length) extra += '<div class="keys">' + T.keys.map(k => `<span class="key">${esc(k)}</span>`).join('') + '</div>';
    if (T.meta?.items.length) extra += '<div class="keys">' + T.meta.items.map(i => `<span class="key">${esc((Core.KEY_LABEL[i.key] || i.key) + ': ' + i.value)}</span>`).join('') + '</div>';
    return `<div class="trk"><div class="trk-h"><div class="ic ${c}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg></div><div><b>${esc(tr('trackTitle', T.n, title))}</b><div class="muted">ID ${T.id ?? '—'} · ${tr('handler')} <span class="mono">${esc(T.handler)}</span>${T.handlerName ? ' · ' + esc(T.handlerName) : ''}</div></div></div><div class="stats">${st.join('')}</div>${extra}</div>`;
  }).join('') + '</div>';
}
function renderMetaTable() {
  const M = S.M, q = S.q.toLowerCase(), rows = [];
  const push = (sec, k, lbl, v, t) => rows.push({ sec, k, lbl, v: String(v), t });
  for (const g of M.metas) for (const i of g.meta.items) push(`${g.title} · ${g.path}`, i.key, Core.KEY_LABEL[i.key], i.value, i.type);
  for (const u of M.udta) push(tr('secUdta'), u.key, '', u.value, 'udta');
  for (const h of M.hdr) { push(tr('secHdr'), h.label + tr('created'), '', `${Core.fmtUtc(Core.qtToMs(h.c))}  (${h.c})`, 'v' + h.v); push(tr('secHdr'), h.label + tr('modified'), '', `${Core.fmtUtc(Core.qtToMs(h.m))}  (${h.m})`, 'v' + h.v); }
  const ft = M.tops.find(t => t.type === 'ftyp'); if (ft) push(tr('secFtyp'), 'major_brand / compatible', '', `${ft.major} / ${ft.compat.join(', ')}`, '');
  push(tr('secFs'), 'lastModified', tr('fsModified'), new Date(S.file.lastModified).toLocaleString(loc()), '');
  const f = rows.filter(r => !q || (r.k + ' ' + (r.lbl || '') + ' ' + r.v).toLowerCase().includes(q));
  let html = `<div class="tblwrap"><table class="tbl"><thead><tr><th>${tr('thKey')}</th><th>${tr('thValue')}</th><th>${tr('thType')}</th></tr></thead><tbody>`, sec = null;
  for (const r of f) { if (r.sec !== sec) { sec = r.sec; html += `<tr class="grp"><td colspan="3">${esc(sec)}</td></tr>`; } html += `<tr><td><div class="k">${esc(r.k)}</div>${r.lbl ? `<div class="muted" style="font-size:12px">${esc(r.lbl)}</div>` : ''}</td><td class="val">${esc(r.v)}</td><td class="muted" style="font-size:12px">${esc(r.t)}</td></tr>`; }
  $('tblBody').innerHTML = f.length ? html + '</tbody></table></div>' : `<div class="emptych">${esc(tr('nothingFound'))}</div>`;
}
function renderExifTable(ifds) {
  const M = S.M, q = (S.tab === 'gps' ? '' : S.q).toLowerCase();
  const IFDN = { IFD0: tr('ifd0'), Exif: tr('ifdExif'), GPS: 'GPS IFD', Interop: 'Interop IFD', IFD1: tr('ifd1') };
  let html = `<div class="tblwrap"><table class="tbl"><thead><tr><th>${tr('thTag')}</th><th>${tr('thValue')}</th><th>${tr('thType')}</th></tr></thead><tbody>`, any = false;
  M.exifs.forEach((T, ei) => {
    for (const ifd of ifds) {
      const tags = T.tags.filter(t => t.ifd === ifd).filter(t => { const v = Core.prettyTag(t); return !q || (t.name + ' ' + (Core.TAG_LABEL[t.name] || '') + ' ' + v).toLowerCase().includes(q); });
      if (!tags.length) continue; any = true;
      html += `<tr class="grp"><td colspan="3">${M.exifs.length > 1 ? esc(ei ? tr('embImg', ei) : tr('mainImg')) : ''}${esc(IFDN[ifd])}</td></tr>`;
      for (const t of tags) html += `<tr><td><div class="k">${esc(t.name)}</div>${Core.TAG_LABEL[t.name] ? `<div class="muted" style="font-size:12px">${esc(Core.TAG_LABEL[t.name])}</div>` : ''}</td><td class="val">${esc(Core.prettyTag(t))}</td><td class="muted" style="font-size:12px">0x${t.tag.toString(16).padStart(4, '0')}</td></tr>`;
    }
  });
  $('tblBody').innerHTML = any ? html + '</tbody></table></div>' : `<div class="emptych">${esc(tr(ifds[0] === 'GPS' ? 'noGps' : 'nothingFound'))}</div>`;
}
function nodeInfo(n) {
  if (!n.data) return '';
  const d = n.data;
  try {
    if (n.type === 'mvhd' || n.type === 'tkhd' || n.type === 'mdhd') { const x = new DataView(d.buffer, d.byteOffset, d.byteLength); const c = d[0] === 1 ? x.getUint32(4) * 4294967296 + x.getUint32(8) : x.getUint32(4); return tr('createdAt') + Core.fmtUtc(Core.qtToMs(c)); }
    if (n.type === 'hdlr') return String.fromCharCode(d[8], d[9], d[10], d[11]);
    if (n.type === 'stsd' && d.length >= 16) return String.fromCharCode(d[12], d[13], d[14], d[15]);
    if (n.type === 'data') { const t = new DataView(d.buffer, d.byteOffset).getUint32(0) & 0xffffff; return t === 1 ? new TextDecoder().decode(d.subarray(8, 80)) : ''; }
    if (n.type === 'infe') return '';
  } catch { }
  return '';
}
function renderTree(M) {
  const rec = (n, depth) => {
    const label = n.isItem ? `[${n.path.split('/').pop().slice(1, -1)}]` : n.type;
    let info = nodeInfo(n);
    if (n.isItem && S.M.kind === 'video') { const mm = S.M.metas.find(g => g.meta.ilst && g.meta.ilst.children.includes(n)); const it = mm?.meta.items.find(i => i.itemNode === n); if (it) info = it.key + ' = ' + it.value; }
    const head = `<span class="ty">${esc(label)}</span><span class="sz">${bytes(n.size)}</span><span class="info">${esc(info)}</span>`;
    if (n.children && n.children.length) return `<details${depth < 1 ? ' open' : ''}><summary>${head}</summary>${n.children.map(c => rec(c, depth + 1)).join('')}</details>`;
    return `<div class="leaf">${head}</div>`;
  };
  if (M.kind === 'video') {
    return '<div class="tree">' + M.tops.map(t => t.type === 'moov' ? rec(M.moov, 0) : `<div class="leaf" style="margin-left:0;border:0;padding-left:20px"><span class="ty">${esc(t.type)}</span><span class="sz">${bytes(t.size)}</span><span class="info">${t.type === 'ftyp' ? esc(t.major + ' · ' + t.compat.join(', ')) : t.type === 'mdat' ? esc(tr('mdatInfo')) : ''}</span></div>`).join('') + '</div>';
  }
  if (M.fmt === 'jpeg') return '<div class="tree">' + M.structure.map(s => `<div class="leaf" style="margin-left:0;border:0"><span class="ty">${esc(s.type)}</span><span class="sz">${bytes(s.size)}</span><span class="info">${esc(s.info)}</span></div>`).join('') + '</div>';
  const counts = {}; M.items.forEach(i => counts[i.type] = (counts[i.type] || 0) + 1);
  const itemsHtml = `<div style="margin:0 0 14px" class="keys">${Object.entries(counts).map(([k, v]) => `<span class="key">${esc(k)} × ${v}</span>`).join('')}${M.primary != null ? `<span class="key">${esc(tr('primaryItem', M.primary))}</span>` : ''}</div>`;
  return itemsHtml + '<div class="tree">' + M.tree.map(n => rec(n, 0)).join('') + '</div>';
}

/* ---------- save ---------- */
async function save() {
  const M = S.M; const btn = $('saveBtn'); btn.disabled = true; btn.textContent = tr('saving');
  const done = () => { btn.textContent = tr('saveBtn'); btn.disabled = !S.changes.length; };
  try {
    const blob = await Core.build(M, S.changes);
    const name = S.file.name;
    let saved = false;
    if (window.showSaveFilePicker) {
      try {
        const ext = (name.match(/\.[^.]+$/) || ['.mov'])[0];
        const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: tr(M.kind === 'video' ? 'kindVideo' : 'kindPhoto'), accept: { [blob.type || 'application/octet-stream']: [ext] } }] });
        const w = await h.createWritable(); await w.write(blob); await w.close(); saved = true;
      } catch (e) { if (e.name === 'AbortError') { done(); return; } }
    }
    if (!saved) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000); }
    $('doneName').textContent = `${name} · ${bytes(blob.size)}`;
    $('doneDate').textContent = S.E ? `${dFmt(S.E.local)}, ${hms(S.E.local)}` : '';
    $('doneDlg').showModal();
  } catch (e) { console.error(e); alert(tr('errSave') + (e.message || e)); }
  done();
}

/* ---------- events ---------- */
const pick = () => $('fileIn').click();
$('openBtn').onclick = pick; $('openBtn2').onclick = pick;
$('fileIn').onchange = e => { const f = e.target.files[0]; if (f) load(f); e.target.value = ''; };
let dragN = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('dropOverlay').classList.add('on'); $('drop').classList.add('over'); });
addEventListener('dragleave', e => { if (--dragN <= 0) { dragN = 0; $('dropOverlay').classList.remove('on'); $('drop').classList.remove('over'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('dropOverlay').classList.remove('on'); $('drop').classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) load(f); });
for (const id of ['inDate', 'inTime', 'inTz', 'inLat', 'inLon', 'inAlt']) $(id).addEventListener('input', () => { readInputs(); recompute(); });
$('inTz').addEventListener('change', () => { readInputs(); recompute(); });
$('inLat').addEventListener('paste', e => { const t = (e.clipboardData || window.clipboardData).getData('text'); const m = /(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/.exec(t); if (m) { e.preventDefault(); $('inLat').value = m[1]; $('inLon').value = m[2]; readInputs(); recompute(); } });
$('locSwitch').onchange = () => { $('locFields').hidden = !$('locSwitch').checked; readInputs(); recompute(); };
$('chips').onclick = e => {
  const b = e.target.closest('button'); if (!b || !S.E) return;
  if (b.id === 'resetDate') { S.E.local = S.M.date.local; S.E.off = S.M.date.off; }
  else S.E.local += +b.dataset.s * 1000;
  fillInputs(); readInputs(); recompute();
};
$('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; S.q = ''; renderTabs(); } };
$('lang').onclick = e => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); };
$('saveBtn').onclick = save;
$('doneOk').onclick = () => $('doneDlg').close();
applyStatic();
})();
</script>
